<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>牙仙子月月</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;
     -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body{ height:100%; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#fff; }
  body{
    background: radial-gradient(ellipse at 50% 10%, #2a4d80 0%, #0b1f3a 60%, #050e20 100%);
    display:flex; align-items:center; justify-content:center; padding:16px; position:relative;
  }
  /* 手机外框 */
  .phone{
    width:min(94vw,400px); height:min(94vh,820px);
    background: linear-gradient(180deg,#173a66 0%,#0d2547 100%);
    border-radius:40px; box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.12);
    display:flex; flex-direction:column; align-items:center; padding:14px 18px 20px;
    overflow-y:auto; position:relative;
  }
  /* 嵌入 Qt 小窗模式：圆角、无黑边、无顶栏按钮 */
  body.embed{ background:transparent; padding:0; }
  body.embed .phone{ width:100%; height:100%; border-radius:22px; box-shadow:none; padding:6px 14px 14px;
                     background:linear-gradient(180deg,#1a4a7a 0%,#0d2547 100%); }
  body.embed .topbar{ display:none; }
  body.embed .moon{ width:min(46%,150px); margin:6px 0 10px; }
  /* 顶栏 */
  .topbar{ width:100%; padding:4px 2px 10px; display:flex; justify-content:space-between; align-items:center; }
  .topbar .brand{ font-size:14px; font-weight:700; letter-spacing:.5px; }
  .gear{ background:rgba(255,255,255,.15); border:0; color:#fff; width:36px; height:36px; border-radius:50%; font-size:16px; cursor:pointer; }
  /* 角色：方形圆角框 */
  .moon{ width:min(50%,190px); margin:4px 0 10px; z-index:2; flex-shrink:0; }
  .moon video{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:20px; display:block;
               border:3px solid rgba(255,211,107,.8); box-shadow:0 8px 26px rgba(0,0,0,.4); transition:transform .3s; }
  .moon.talking video{ transform:scale(1.05); }
  /* 气泡：自动换行不溢出 */
  .bubble{
    width:100%; background:rgba(255,255,255,.97); color:#0b1f3a;
    border-radius:18px; padding:14px 16px; font-size:17px; line-height:1.6; text-align:left; font-weight:500;
    box-shadow:0 6px 20px rgba(0,0,0,.3); margin-bottom:8px;
    word-break:break-word; overflow-wrap:anywhere; white-space:normal;
  }
  .status{ font-size:12px; opacity:.7; min-height:18px; margin-bottom:8px; text-align:center; }
  /* 输入行：手机端始终显示，方便打字 */
  .inputrow{ width:100%; display:flex; gap:8px; margin-bottom:12px; }
  .inputrow.show{ display:flex; }
  .inputrow input{ flex:1; border:2px solid #f9a8d4; border-radius:14px; padding:10px 12px; font-size:15px; }
  .inputrow button{ padding:10px 16px; font-size:15px; }
  /* 按钮 */
  .btns{ display:flex; gap:12px; margin-top:auto; flex-wrap:wrap; justify-content:center; }
  button{
    border:0; border-radius:999px; padding:14px 22px; font-size:17px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:6px; color:#fff; box-shadow:0 6px 16px rgba(0,0,0,.3);
    transition:transform .1s;
  }
  button:active{ transform:scale(.96); }
  .b-mic{ background:linear-gradient(135deg,#2ea8e6,#6bb8ff); }
  .b-photo{ background:linear-gradient(135deg,#ef6ba8,#ff9ccb); }
  /* 设置弹窗 */
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:10; padding:20px; }
  .modal.show{ display:flex; }
  .card{ background:#fff; color:#0b1f3a; border-radius:20px; padding:24px; width:min(90vw,380px); }
  .card h3{ font-size:18px; margin-bottom:10px; }
  .card p{ font-size:13px; color:#555; line-height:1.6; margin-bottom:12px; }
  .card input{ width:100%; border:2px solid #bcd8f5; border-radius:12px; padding:12px; font-size:15px; margin-bottom:12px; }
  .card .row{ display:flex; gap:10px; justify-content:flex-end; }
  .card .save{ background:#2ea8e6; }
  .card .close2{ background:#999; }
  /* 照片预览 */
  .preview{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:9; padding:20px; }
  .preview img{ max-width:90vw; max-height:55vh; border-radius:16px; }
  .preview p{ color:#fff; font-size:17px; text-align:center; max-width:90vw; line-height:1.7; margin-top:14px; }
  input[type=file]{ display:none; }
  /* 课堂舞台模式：只留月月和气泡 */
  body.stage{ padding:0; }
  body.stage .phone{ width:100%; height:100vh; border-radius:0; box-shadow:none; justify-content:center; }
  body.stage .topbar, body.stage .btns, body.stage .inputrow, body.stage .status{ display:none !important; }
  body.stage .moon{ width:min(60vw,380px); cursor:pointer; }
  body.stage .moon video{ border-radius:24px; }
  body.stage .bubble{ position:fixed; bottom:5vh; left:50%; transform:translateX(-50%);
                       width:min(88vw,640px); font-size:22px; }
  #exitStage{ position:fixed; top:12px; right:12px; z-index:20; background:rgba(255,255,255,.2);
              border:0; color:#fff; width:38px; height:38px; border-radius:50%; font-size:16px; display:none; }
  body.stage #exitStage{ display:block; }
</style>
</head>

const SYSTEM = `你是面向12岁以下儿童的护牙虚拟学伴"牙仙子月月"。形象：Q版牙仙子，温柔甜美女声。
你只回答护牙相关话题：刷牙方法、糖与甜饮料/白开水、乳牙换牙六龄牙、看牙医情绪、常见牙齿小情况。
回答要求：温柔鼓励、短句、像跟小朋友说话；不诊断、不开药、不评价孩子牙齿好坏。

/* ---------- 语音：优先甜美女声 ---------- */
let zhVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  // 优先 Windows 在线自然女声 / 经典女声
  const prefs = ['Xiaoxiao','Xiaoyi','Xiaomo','Xiaohan','Xiaoxuan','Xiaorui','Huihui','Yaoyao','Tingting'];
  for(const p of prefs){
    const v = vs.find(v=>v.name && v.name.includes(p));
    if(v){ zhVoice=v; return; }
  }
  zhVoice = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
}
pickVoice();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = pickVoice;

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.9; u.pitch=1.2;
  if(zhVoice) u.voice=zhVoice;
  moon.classList.add('talking');
  u.onend = ()=> moon.classList.remove('talking');
  u.onerror = ()=> moon.classList.remove('talking');
  speechSynthesis.speak(u);
}

/* ---------- 本地兜底问答 ---------- */
const KB=[
 ['你是谁','你叫什么','谁是你'],'我是牙仙子月月！四颗守护钻石都亮啦，专门陪你保护小牙齿。',
 ['怎么刷','刷牙','画圈'],'外面画圈圈，里面慢慢刷，前牙竖起来，咬合面来回刷，每颗都要到哦。',
 ['牙膏','挤多少'],'牙膏像豌豆那么大就够啦，泡泡吐出来不要吞下。',
 ['糖','甜饮料','可乐'],'口渴最好喝白开水；甜的要少喝，睡觉前可千万别喝。',
 ['蛀牙','虫牙'],'小细菌最爱甜的，没刷干净就冒酸泡泡，牙齿上就出小坑。',
 ['换牙','松了','掉牙'],'现在的小牙叫乳牙，以后会换成恒牙陪你一辈子，别用手去晃它。',

];
function localReply(q){
  for(let i=0;i<KB.length;i+=2){ if(KB[i].some(w=>q.includes(w))) return KB[i+1]; }
  return '我是牙仙子，只懂保护牙齿的事哦。关于刷牙、吃糖、换牙的问题，你来问我吧！';
}

/* ---------- DeepSeek 真实问答 ---------- */
async function askDeepSeek(q){
  // 通过 server.py(http) 访问时走本地代理；双击 file:// 打开时直连 DeepSeek
  if(location.protocol.startsWith('http')){
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    return d;  // {reply, audio}
  }
  const r = await fetch('https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'doubao-seed-evolving',messages:[{role:'system',content:SYSTEM},{role:'user',content:q}],temperature:0.7,max_tokens:120})
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  return {reply: d.choices[0].message.content.trim(), audio:null};
}

/* 播放云端甜声音频；没有就退回系统语音 */
let curAudio = null;
function playAnswer(ans, audioB64){
  bubble.textContent = ans;
  if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }
  moon.classList.add('talking');
  const url = '/api/tts?text=' + encodeURIComponent(ans);
  curAudio = new Audio(url);
  curAudio.onended = ()=> { moon.classList.remove('talking'); curAudio=null; };
  curAudio.onerror = ()=> { moon.classList.remove('talking'); speak(ans); };
  curAudio.play().catch(()=>{
    moon.classList.remove('talking');
    speak(ans);
  });
}

async function handleAsk(q){
  if(!q || !q.trim()) return;
  status.textContent = '月月想一下…';
  let ans;
  const useAI = apiKey || location.protocol.startsWith('http');
  if(useAI){
    try{ const r = await askDeepSeek(q); ans=r.reply; }
    catch(e){ ans = localReply(q); status.textContent='网络问题，先用本地答案：'+e; }
  } else {
    ans = localReply(q);
    status.textContent = '演示模式';
  }
  playAnswer(ans);
}

/* ---------- 麦克风 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const btnMic = document.getElementById('btnMic');
const inputrow = document.getElementById('inputrow');
const isFile = location.protocol === 'file:';
if(isFile){ status.textContent = '小提示：双击打开时语音识别不可用，请用下方输入框打字'; }
if(!SR){
  status.textContent = '此浏览器不支持语音识别，请用下方输入框打字';
  btnMic.disabled = true; btnMic.style.opacity = .5;
} else {
  const rec = new SR(); rec.lang='zh-CN'; rec.interimResults=false;
  btnMic.onclick = ()=>{
    if(recognizing){ rec.stop(); return; }
    try{ rec.start(); }catch(e){}
    recognizing=true; btnMic.textContent='🔴 正在听…'; status.textContent='请说…';
  };
  rec.onresult = e=>{ const q=e.results[0][0].transcript; status.textContent='你说：'+q; handleAsk(q); };
  rec.onend = ()=>{ recognizing=false; btnMic.textContent='🎤 和月月对话'; };
  rec.onerror = e=>{
    recognizing=false; btnMic.textContent='🎤 和月月对话';
    if(isFile || e.error==='not-allowed' || e.error==='service-not-allowed'){
      status.textContent='语音识别需 http://localhost 或 https 环境：请用下方输入框打字，或用 server.py 启动';
    } else {
      status.textContent='没听清，请再点一次麦克风，或打字问我（错误：'+e.error+'）';
    }
  };
}
document.getElementById('btnSend').onclick = ()=>{ const t=document.getElementById('txt'); handleAsk(t.value); t.value=''; };

/* ---------- 课堂舞台模式 ---------- */
document.getElementById('btnStage').onclick = ()=> document.body.classList.add('stage');
document.getElementById('exitStage').onclick = ()=> document.body.classList.remove('stage');
document.getElementById('moon').onclick = ()=>{
  if(document.body.classList.contains('stage') && btnMic && !btnMic.disabled) btnMic.click();
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.body.classList.remove('stage'); });
/* URL 带 ?mode=stage 自动进入纯卡通舞台（教室大屏用） */
if(new URLSearchParams(location.search).get('mode')==='stage'){
  document.body.classList.add('stage');
}

/* ---------- 照片 ---------- */
const file = document.getElementById('file');
const preview = document.getElementById('preview');
document.getElementById('btnPhoto').onclick = ()=> file.click();
file.onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload = ev=>{
    document.getElementById('previewImg').src=ev.target.result;
    const msg='月月认真看了看：记得把里面和后牙都刷到哦。不确定的地方，让爸爸妈妈带你请牙医检查最准确。';
    document.getElementById('previewText').textContent=msg;
    preview.style.display='flex'; speak(msg);
  };
  rd.readAsDataURL(f);
};
document.getElementById('btnClose').onclick = ()=> preview.style.display='none';

/* ---------- 设置 ---------- */
const modal=document.getElementById('modal');
document.getElementById('btnGear').onclick=()=>{ document.getElementById('apiKey').value=apiKey; modal.classList.add('show'); };
document.getElementById('btnCloseModal').onclick=()=> modal.classList.remove('show');
document.getElementById('btnSave').onclick=()=>{
  apiKey=document.getElementById('apiKey').value.trim();
  localStorage.setItem('ds_key',apiKey);
  modal.classList.remove('show');
  status.textContent = apiKey? '已连接 DeepSeek，点麦克风直接问月月。' : '已清除Key，回到演示模式。';
};

setTimeout(()=> speak(bubble.textContent), 600);
/* 嵌入小窗：打开时自动播放云端欢迎语音 */
if(document.body.classList.contains('embed')){
  setTimeout(()=>{
    const a = new Audio('/greeting.mp3');
    a.play().catch(()=>{});
  }, 400);
}
</script>
</body>
</html>
